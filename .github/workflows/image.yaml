# Build, scan, sign. The scan fails the job on a critical CVE that has a fix, so the image never gets a signature
# and Kyverno never admits it. Signing is keyless: the GitHub OIDC identity of this workflow is the signer.
name: image
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/image.yaml"]
  pull_request:
    paths: ["app/**", ".github/workflows/image.yaml"]
permissions:
  contents: read
  packages: write
  id-token: write
env:
  IMAGE: ghcr.io/tolugit/verda-k8s-hardening/web
jobs:
  build-scan-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: build (local, not pushed yet)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { context: app, load: true, tags: "${{ env.IMAGE }}:${{ github.sha }}" }
      - name: scan, fail on critical with a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE }}:${{ github.sha }}"
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: push the image that was scanned (no second build)
        if: github.event_name == 'push'
        id: push
        run: |
          docker tag "${IMAGE}:${{ github.sha }}" "${IMAGE}:main"
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:main"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${{ github.sha }}" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed ${IMAGE}@$digest"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'push'
      - name: sign (keyless, GitHub OIDC)
        if: github.event_name == 'push'
        # cosign v3 writes a Sigstore bundle as an OCI referrer. Also write the legacy sha256-<digest>.sig tag,
        # which is what Kyverno's default Cosign attestor verifies. Both point at the same digest.
        run: |
          cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: sbom attestation
        if: github.event_name == 'push'
        run: |
          # pinned release, checksum verified against the release's checksums file. Both come from the same release, so
          # this catches a corrupt or swapped archive, not a compromised release; verifying the upstream signature on the
          # checksums file would close that and is not done here.
          curl -fsSLo syft.tgz https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz
          curl -fsSLo syft.sums https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_checksums.txt
          grep ' syft_1.55.0_linux_amd64.tar.gz$' syft.sums | sed 's# syft_1.55.0_linux_amd64.tar.gz# syft.tgz#' | sha256sum -c -
          tar -xzf syft.tgz syft && sudo install syft /usr/local/bin/syft
          syft "${IMAGE}@${{ steps.push.outputs.digest }}" -o spdx-json > sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: digest
        if: github.event_name == 'push'
        run: echo "${IMAGE}@${{ steps.push.outputs.digest }}"
