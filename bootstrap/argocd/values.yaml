# Argo CD runs without an ingress. Access is kubectl port-forward over an SSH tunnel; nothing is exposed publicly.
global:
  domain: argocd.local
configs:
  params:
    server.insecure: true
  cm:
    timeout.reconciliation: 60s
    # reviewers log in as this account; it maps to Argo CD's built-in read-only role below
    accounts.reviewer: login
  rbac:
    policy.default: ""
    policy.csv: |
      g, reviewer, role:readonly
server:
  replicas: 1
controller:
  replicas: 1
repoServer:
  replicas: 1
applicationSet:
  enabled: false
notifications:
  enabled: false
dex:
  enabled: false
