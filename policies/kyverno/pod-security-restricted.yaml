# Pod Security Standards, restricted profile, applied by Kyverno so the failure message names the field.
# Ran in Audit first; the tenant workloads passed cleanly (policy reports: 4 pass, 0 fail), then flipped to Enforce.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pod-security-restricted
  annotations:
    policies.kyverno.io/description: "Baseline + restricted PSS for every tenant namespace."
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: restricted
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels: { tenant: "true" }
      validate:
        podSecurity:
          level: restricted
          version: latest
