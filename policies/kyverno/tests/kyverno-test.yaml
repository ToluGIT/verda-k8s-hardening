apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-admission
variables: values.yaml
policies:
  - ../pod-security-restricted.yaml
  - ../disallow-latest-tag.yaml
  - ../restrict-image-registries.yaml
resources:
  - resources/good-pod.yaml
  - resources/bad-pods.yaml
results:
  - policy: pod-security-restricted
    rule: restricted
    resources: [good]
    kind: Pod
    result: pass
  - policy: pod-security-restricted
    rule: restricted
    resources: [privileged]
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    rule: no-latest
    resources: [latest-tag]
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    rule: no-latest
    resources: [good]
    kind: Pod
    result: pass
  - policy: restrict-image-registries
    rule: allowed-registries
    resources: [foreign-registry]
    kind: Pod
    result: fail
  - policy: restrict-image-registries
    rule: allowed-registries
    resources: [good]
    kind: Pod
    result: pass
  - policy: restrict-image-registries
    rule: allowed-registries
    resources: [dockerhub-random-account]
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    rule: require-tag
    resources: [untagged]
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    rule: no-latest
    resources: [bad-init-container]
    kind: Pod
    result: fail
