# Images from this repo's GHCR path must carry a keyless cosign signature made by this repo's image workflow.
# Any other ghcr.io/tolugit/verda-k8s-hardening/* image, signed by anyone else or not at all, is refused.
# Scoped to that path so the tenants' other allowed registries keep working; widening it is one line.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: cosign-keyless-github
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels: { tenant: "true" }
      verifyImages:
        - imageReferences: ["ghcr.io/tolugit/verda-k8s-hardening/*"]
          # cosign v3 stores the signature as an OCI-referrer Sigstore bundle, not the legacy sha256-<digest>.sig tag.
          # With the default (Cosign) type Kyverno looked for the tag and said "no signatures found". See worklog.
          type: SigstoreBundle
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: https://github.com/ToluGIT/verda-k8s-hardening/.github/workflows/image.yaml@refs/heads/main
                    rekor: { url: https://rekor.sigstore.dev }
