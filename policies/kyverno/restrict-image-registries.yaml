# Tenant images come from a short allow-list of publishers, not whole registries: any Docker Hub account is not an
# allow-list. Adding a publisher is a one-line pull request.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: allowed-registries
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels: { tenant: "true" }
      validate:
        message: "Image publisher not on the allow-list (see policies/kyverno/restrict-image-registries.yaml)."
        pattern:
          spec:
            containers:
              - image: "docker.io/library/* | docker.io/nginxinc/* | ghcr.io/tolugit/verda-k8s-hardening/* | quay.io/cilium/* | registry.k8s.io/*"
            =(initContainers):
              - image: "docker.io/library/* | docker.io/nginxinc/* | ghcr.io/tolugit/verda-k8s-hardening/* | quay.io/cilium/* | registry.k8s.io/*"
