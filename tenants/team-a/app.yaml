# A restricted-profile web app: non-root image, no privilege escalation, all capabilities dropped, read-only root.
# Image is this repo's own build, pinned by digest and cosign-signed; Kyverno refuses anything on this path that is not.
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: team-a, labels: { app: web } }
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      serviceAccountName: team-a-dev
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/tolugit/verda-k8s-hardening/web@sha256:9592375ba07eb80306e76013419bb38fe9ce1694d1409c150997753f85cc6790
          ports: [{ containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: team-a }
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8080 }]
