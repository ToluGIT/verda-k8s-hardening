# Object counts matter as much as CPU. A tenant that can create unlimited Deployments or Pods can take
# down shared components (Prometheus, the API server) without ever using much CPU.
apiVersion: v1
kind: ResourceQuota
metadata: { name: team-b-quota, namespace: team-b }
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "20"
    count/deployments.apps: "10"
    count/jobs.batch: "10"
    count/cronjobs.batch: "5"
    services: "10"
    services.nodeports: "0"
    services.loadbalancers: "0"
    secrets: "30"
    configmaps: "30"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata: { name: team-b-limits, namespace: team-b }
spec:
  limits:
    - type: Container
      default: { cpu: 200m, memory: 256Mi }
      defaultRequest: { cpu: 50m, memory: 64Mi }
      max: { cpu: "1", memory: 2Gi }
