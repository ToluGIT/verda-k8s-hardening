apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: trivy-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # retry: webhook can be slow while kyverno starts
    retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
  source:
    repoURL: https://aquasecurity.github.io/helm-charts/
    chart: trivy-operator
    targetRevision: 0.38.1
    helm:
      valuesObject:
        operator:
          scanJobsConcurrentLimit: 2
          metricsVulnIdEnabled: true
          configAuditScannerEnabled: true
          rbacAssessmentScannerEnabled: true
          infraAssessmentScannerEnabled: true
        serviceMonitor: { enabled: true }
        # the node collector runs a pod on every node, including the control plane, to run kube-bench style checks
        nodeCollector:
          tolerations:
            - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
        trivy:
          ignoreUnfixed: false
