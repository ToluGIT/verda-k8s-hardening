# Three alerts a security on-call would act on. Not a catalogue.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: security-plane
  namespace: monitoring
spec:
  groups:
    - name: security-plane
      rules:
        - alert: TenantImageHasCriticalCVE
          expr: sum by (namespace, image_repository, image_tag) (trivy_image_vulnerabilities{severity="Critical", namespace=~"team-.*"}) > 0
          for: 10m
          labels: { severity: high }
          annotations:
            summary: "Critical CVE running in {{ $labels.namespace }}"
            description: "{{ $labels.image_repository }}:{{ $labels.image_tag }} has {{ $value }} critical findings. Rebuild or pin a fixed tag."
        - alert: KyvernoDenialsSpike
          expr: sum(increase(kyverno_admission_requests_total{request_allowed="false"}[10m])) > 5
          for: 0m
          labels: { severity: medium }
          annotations:
            summary: "More than 5 admission denials in 10 minutes"
            description: "Someone or something is repeatedly trying to admit non-compliant workloads. Check kyverno policy reports and audit log."
        - alert: CiliumPolicyDropsSpike
          expr: sum(increase(hubble_drop_total{reason="POLICY_DENIED"}[10m])) > 200
          for: 5m
          labels: { severity: medium }
          annotations:
            summary: "Network policy drops above baseline"
            description: "{{ $value }} flows denied by policy in 10 minutes. Either a misconfigured app or a tenant probing."
        - alert: SecurityAgentDown
          expr: |
            (kube_daemonset_status_number_ready{daemonset=~"cilium|tetragon"} < kube_daemonset_status_desired_number_scheduled{daemonset=~"cilium|tetragon"})
            or absent(kube_daemonset_status_desired_number_scheduled{daemonset="cilium"})
            or absent(kube_daemonset_status_desired_number_scheduled{daemonset="tetragon"})
          for: 5m
          labels: { severity: high }
          annotations:
            summary: "{{ $labels.daemonset }} not running on every node, or the DaemonSet is gone"
            description: "A node without the CNI or runtime sensor is a node without policy or detection."
