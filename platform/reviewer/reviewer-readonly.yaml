# Read-only identity for the people reviewing this. Cluster-wide get/list/watch, no secrets, no exec, no writes.
# The one write-shaped verb is create on pods/portforward, which the Grafana and Argo CD tunnels in the README need.
apiVersion: v1
kind: Namespace
metadata: { name: reviewer }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: reviewer, namespace: reviewer }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: reviewer-readonly }
rules:
  - apiGroups: [""]
    resources: [namespaces, nodes, pods, pods/log, services, endpoints, configmaps, serviceaccounts, resourcequotas, limitranges, events, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps, batch, rbac.authorization.k8s.io, networking.k8s.io, policy, apiextensions.k8s.io, admissionregistration.k8s.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [cilium.io, kyverno.io, policies.kyverno.io, wgpolicyk8s.io, aquasecurity.github.io, argoproj.io, monitoring.coreos.com]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
  - nonResourceURLs: ["/metrics", "/version", "/healthz", "/readyz"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: reviewer-readonly }
subjects: [{ kind: ServiceAccount, name: reviewer, namespace: reviewer }]
roleRef: { kind: ClusterRole, name: reviewer-readonly, apiGroup: rbac.authorization.k8s.io }
