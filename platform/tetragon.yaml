apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tetragon
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: kube-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # a sync that hits a webhook timeout (kyverno starting, network blip) should retry, not sit OutOfSync until the next commit
    retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
  source:
    repoURL: https://helm.cilium.io/
    chart: tetragon
    targetRevision: 1.8.0
    helm:
      valuesObject:
        tetragon:
          exportDenyNamespaces: ["kube-system", "monitoring", "trivy-system"]
          prometheus: { enabled: true, serviceMonitor: { enabled: true } }
