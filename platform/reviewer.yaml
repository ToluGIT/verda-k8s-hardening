apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reviewer
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "2" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: reviewer }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
  source: { repoURL: git@github.com:ToluGIT/verda-k8s-hardening.git, targetRevision: main, path: platform/reviewer }
