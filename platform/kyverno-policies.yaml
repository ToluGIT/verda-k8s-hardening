apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: kyverno }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # a sync that hits a webhook timeout (kyverno starting, network blip) should retry, not sit OutOfSync until the next commit
    retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, SkipDryRunOnMissingResource=true, RespectIgnoreDifferences=true]
  # The API server defaults four fields on a ClusterPolicy that the policy files do not set
  # (admission, emitWarning, skipBackgroundRequests, allowExistingViolations). Checked by diffing live vs git.
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - ".spec.admission"
        - ".spec.emitWarning"
        - ".spec.rules[].skipBackgroundRequests"
        - ".spec.rules[].validate.allowExistingViolations"
  source: { repoURL: git@github.com:ToluGIT/verda-k8s-hardening.git, targetRevision: main, path: policies/kyverno }
