apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "0" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: kyverno }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # retry: webhook can be slow while kyverno starts
    retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
  # the chart renders empty `labels: {}` / `annotations: {}` on the CEL policy CRDs and the API server drops
  # them, and it defaults conversion.strategy. Field-level diff done by hand; none of it is drift.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions: [".metadata.labels", ".metadata.annotations", ".spec.conversion"]
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.9.2
    helm:
      valuesObject:
        admissionController: { replicas: 1 }
        backgroundController: { replicas: 1 }
        cleanupController: { replicas: 1 }
        reportsController: { replicas: 1 }
        features:
          policyExceptions: { enabled: true, namespace: kyverno }
