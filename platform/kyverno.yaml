apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "0" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: kyverno }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # a sync that hits a webhook timeout (kyverno starting, network blip) should retry, not sit OutOfSync until the next commit
    retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
  # the chart renders `labels: {}` on the CEL policy CRDs and the API server drops the empty map; not a real drift
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions: [".metadata.labels"]
      managedFieldsManagers: [kyverno]
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.9.2
    helm:
      valuesObject:
        admissionController: { replicas: 1 }
        backgroundController: { replicas: 1 }
        cleanupController: { replicas: 1 }
        reportsController: { replicas: 1 }
        features:
          policyExceptions: { enabled: true, namespace: kyverno }
