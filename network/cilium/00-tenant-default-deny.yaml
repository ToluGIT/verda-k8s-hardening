# Every pod in a namespace labelled tenant=true starts with no ingress and no egress.
# Selecting an endpoint with empty rule lists is how Cilium expresses default deny.
# Everything a tenant is allowed to do is a separate, named policy below or in tenants/.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: tenant-default-deny
spec:
  description: default deny for tenant namespaces
  endpointSelector:
    matchLabels:
      k8s:io.cilium.k8s.namespace.labels.tenant: "true"
  ingress: []
  egress: []
