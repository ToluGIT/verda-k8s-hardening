# Tenants may ask CoreDNS, and only CoreDNS, and only on 53. The dns rule turns on the DNS proxy so
# Hubble records every query by name, and FQDN egress policies can be written per tenant.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: tenant-allow-dns
spec:
  description: tenant pods may resolve names through kube-dns
  endpointSelector:
    matchLabels:
      k8s:io.cilium.k8s.namespace.labels.tenant: "true"
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
          rules:
            dns:
              - matchPattern: "*"
