#!/usr/sbin/nft -f
# Host firewall, identical on every node. Verda FIN-01 gives public IPs only, so this is the edge.
# Rules: loopback and established traffic; ICMP; SSH (key-only) from anywhere; the API server from my
# workstation and from the nodes; everything between the three nodes; drop the rest.
#
# Only this table is flushed. `flush ruleset` would also delete the iptables-nft tables Cilium programs
# (its TPROXY rules for the DNS/L7 proxy, and NAT when iptables masquerade is on). Learned the hard way, 1 Nov.
add table inet filter
flush table inet filter

define NODES = { 65.108.33.68, 65.108.32.164, 65.108.33.95 }
define ADMIN = { 149.241.162.239 }

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;

    iif lo accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept

    # cluster traffic between the nodes: kubelet, etcd, vxlan, cilium health, hubble
    ip saddr $NODES accept

    # operator access
    tcp dport 22 accept
    ip saddr $ADMIN tcp dport 6443 accept

    # anything else is logged at a sane rate then dropped
    limit rate 5/second log prefix "nft-drop " drop
  }
  chain forward {
    # pod traffic is handled by Cilium; let the host forward it
    type filter hook forward priority 0; policy accept;
  }
  chain output {
    type filter hook output priority 0; policy accept;
  }
}
